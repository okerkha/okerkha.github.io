<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olga LASTNAME — Senior BIM Specialist</title>
<meta name="description" content="Senior BIM Specialist. Data pipelines, automation, and digital delivery.">
<meta name="theme-color" content="#DEDFDA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#DEDFDA;      /* light grey ground */
  --ink:#2F3438;        /* dark grey, not black */
  --ink-mid:#767C82;    /* secondary text */
  --hairline:#BFC2BD;   /* rules */
  --marker:#E5D95C;     /* highlighter */
  --sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* ---------- sheet + registration marks ---------- */

.sheet{
  position:relative;
  width:100%;
  max-width:440px;
  border:1px solid var(--hairline);
  padding:34px 22px 0;
}
.sheet::before,.sheet::after{
  content:"";position:absolute;width:11px;height:11px;
  border:1px solid var(--ink);pointer-events:none;
}
.sheet::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.sheet::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

/* ---------- name ---------- */

.name{
  font-size:clamp(2.6rem,13vw,3.9rem);
  font-weight:700;
  line-height:.95;
  letter-spacing:-.03em;
  text-transform:uppercase;
}
.name span{position:relative;display:inline-block}
.name span::before{
  content:"";
  position:absolute;
  left:-.05em;right:-.06em;
  top:.20em;bottom:.08em;
  background:var(--marker);
  border-radius:2px 5px 3px 4px;
  transform:rotate(-.5deg) scaleX(0);
  transform-origin:left center;
  z-index:-1;
  animation:swipe .5s cubic-bezier(.22,.8,.3,1) .25s forwards;
}

.role{
  font-size:1rem;
  font-weight:500;
  padding-top:18px;
  line-height:1.35;
}
.focus{
  font-size:.92rem;
  color:var(--ink-mid);
  padding-top:4px;
  line-height:1.45;
}

.rule{border:0;border-top:2px solid var(--ink);margin:24px 0 20px}

/* ---------- actions ---------- */

.actions{display:flex;flex-direction:column;gap:9px;padding-bottom:26px}

.btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:56px;
  padding:0 18px;
  border:1px solid var(--ink);
  font-family:var(--sans);
  font-size:1rem;
  font-weight:500;
  text-decoration:none;
  color:var(--ink);
  background:transparent;
  opacity:0;
  transform:translateY(7px);
  animation:rise .42s ease-out forwards;
}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn .mark{font-family:var(--mono);font-size:.78rem;opacity:.6}
.btn:nth-of-type(1){animation-delay:.38s}
.btn:nth-of-type(2){animation-delay:.44s}
.btn:nth-of-type(3){animation-delay:.50s}
.btn:nth-of-type(4){animation-delay:.56s}

.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

@media (hover:hover){
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn-primary:hover{background:var(--ink-mid);border-color:var(--ink-mid)}
}

/* ---------- title block ---------- */

.titleblock{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  border-top:1px solid var(--hairline);
  margin:0 -22px;
}
.field{padding:13px 10px 17px;border-right:1px solid var(--hairline)}
.field:first-child{padding-left:22px}
.field:last-child{border-right:0;padding-right:22px}
.field dt{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-mid);
  padding-bottom:6px;
}
.field dd{font-size:.8rem;font-weight:500;line-height:1.3}

@keyframes swipe{to{transform:rotate(-.5deg) scaleX(1)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  .name span::before{animation:none;transform:rotate(-.5deg) scaleX(1)}
  .btn{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>

<main class="sheet">

  <h1 class="name">Olga<br><span>LASTNAME</span></h1>

  <p class="role">Senior BIM Specialist</p>
  <p class="focus">Data pipelines, automation, and digital delivery.</p>

  <hr class="rule">

  <nav class="actions">

    <a class="btn btn-primary" href="contact.vcf" type="text/vcard">
      Save contact <span class="mark">VCF</span>
    </a>

    <a class="btn" href="https://www.linkedin.com/in/YOUR-HANDLE" target="_blank" rel="noopener">
      LinkedIn <span class="mark">&#8599;</span>
    </a>

    <!-- To add a link later, copy this block and uncomment it:
    <a class="btn" href="https://github.com/YOUR-HANDLE" target="_blank" rel="noopener">
      GitHub <span class="mark">&#8599;</span>
    </a>
    -->

  </nav>

  <dl class="titleblock">
    <div class="field">
      <dt>Discipline</dt>
      <dd>BIM &middot; Data &middot; Automation</dd>
    </div>
    <div class="field">
      <dt>Based</dt>
      <dd>Montreal, QC</dd>
    </div>
  </dl>

</main>

</body>
</html>
